version: '3.8'

services:
  springboot:
    build:
      context: .
      dockerfile: springboot/Dockerfile
    image: interview/springboot:latest
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector

  gen-ai-spring-ai:
    build:
      context: .
      dockerfile: ai/gen-ai-spring-ai/Dockerfile
    image: interview/gen-ai-spring-ai:latest
    ports:
      - "8081:8081"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector

  gen-ai-langchain4j:
    build:
      context: .
      dockerfile: ai/gen-ai-langchain4j/Dockerfile
    image: interview/gen-ai-langchain4j:latest
    ports:
      - "8082:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.80.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "55681:55681" # OTLP HTTP (alternate)
      - "8888:8888" # Prometheus metrics from collector

  jaeger:
    image: jaegertracing/all-in-one:1.41
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC collector

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - springboot
      - gen-ai-spring-ai
      - gen-ai-langchain4j

networks:
  default:
    name: interview-net
