global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'springboot'
    static_configs:
      - targets: ['springboot:8080']
    metrics_path: /actuator/prometheus

  - job_name: 'gen-ai-spring-ai'
    static_configs:
      - targets: ['gen-ai-spring-ai:8081']
    metrics_path: /actuator/prometheus

  - job_name: 'gen-ai-langchain4j'
    static_configs:
      - targets: ['gen-ai-langchain4j:8082']
    metrics_path: /actuator/prometheus

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: /metrics
