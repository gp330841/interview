management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http_server_requests: true
  tracing:
    sampling:
      probability: 0.1

# OpenTelemetry exporter settings (can be overridden with env vars)
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      # protocol can be 'grpc' or 'http/protobuf'
      protocol: grpc

# Promote traceId and spanId into response headers
spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg %n%X{traceId} %X{spanId}"

# Prometheus exemplar note: enabling exemplars may require Prometheus server and client support
# Additional exemplar configuration and OTLP exemplar export may be needed in production.
