# P6Spy configuration - send SQL logs to SLF4J so MDC (traceId/spanId/requestId) is included
modulelist=core
appender=com.p6spy.engine.spy.appender.Slf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.SingleLineFormat
excludecategories=info,debug,result,batch
# Optional: disable stack trace logging
stackTrace=false
# Log threshold
logMessageFormatOptions=includeConnectionId
