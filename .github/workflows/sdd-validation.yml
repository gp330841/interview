name: SDD Spec & Config Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-sdd:
    name: Validate .specify Structure & Config (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Validate SDD using Java 25 Single-File Source Program
        run: java --enable-preview .specify/validate_sdd.java
